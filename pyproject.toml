[project]
name = "heretic-llm"
version = "1.1.0"
description = "Fully automatic censorship removal for language models"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Philipp Emanuel Weidmann", email = "pew@worldwidemann.com" }
]
requires-python = ">=3.10"
keywords = ["llm", "transformer", "abliteration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "accelerate>=1.10.0",
    "bitsandbytes>=0.45.0",
    "datasets>=4.0.0",
    "hf-transfer>=0.1.9",
    "huggingface-hub>=0.34.4",
    "kernels>=0.11.7",
    "optuna>=4.5.0",
    "peft>=0.14.0",
    "psutil>=7.1.3",
    "pydantic-settings>=2.10.1",
    "questionary>=2.1.1",
    "rich>=14.1.0",
    # Keep compatible with vendored SGLang (pins transformers==4.57.1).
    "transformers>=4.57.1",
]

[project.optional-dependencies]
research = [
    "geom-median>=0.1.0",
    "imageio>=2.37.2",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "pacmap>=0.8.0",
    "scikit-learn>=1.7.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "ty>=0.0.5",
]
inference = [
    # When developing against embedded SGLang Engine, keep it editable and uv-managed.
    "sglang",
    # Required for KTransformers RAWINT4 / EP wrapper (Kimi-K2.5).
    "kt-kernel",
]

[project.urls]
Homepage = "https://github.com/p-e-w/heretic"
Documentation = "https://github.com/p-e-w/heretic"
Repository = "https://github.com/p-e-w/heretic.git"
Issues = "https://github.com/p-e-w/heretic/issues"
Changelog = "https://github.com/p-e-w/heretic/releases"

[project.scripts]
heretic = "heretic.main:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "heretic"

[tool.uv]
# Ensure `uv sync` installs the inference group by default in this repo.
default-groups = ["dev", "inference"]
# Work around torch==2.9.1 + CuDNN<9.15 Conv3d perf/mem bug for multimodal models.
# SGLang hard-fails on this combination (see PyTorch issue 168167).
override-dependencies = ["nvidia-cudnn-cu12==9.16.0.29"]

[tool.uv.sources]
# Vendored SGLang (submodule) as editable dependency.
sglang = { path = "vendor/sglang/python", editable = true }
# Vendored KT-Kernel (submodule) as editable dependency.
kt-kernel = { path = "vendor/ktransformers/kt-kernel", editable = true }
